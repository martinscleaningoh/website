name: Rename to index.html
on:
  push:
    paths:
      - '.github/workflows/rename.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "martinscleaningoh"
          git config user.email "martinscleaningoh@users.noreply.github.com"
          if [ -f martins-cleaning-website.html ] && [ ! -f index.html ]; then
            git mv martins-cleaning-website.html index.html
            git commit -m "Rename martins-cleaning-website.html to index.html"
            git push
          fi
